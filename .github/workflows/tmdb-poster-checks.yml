name: TMDB Poster Checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'extension-lotes/**'
      - 'compose.yml'
      - '.github/workflows/tmdb-poster-checks.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # A suíte completa anterior tem falhas independentes nesta branch
      # (mocks de extensão e fixture de série). Este PR verifica apenas TMDB.
      - name: TMDB helpers
        run: node --test test/tmdb.test.js
        working-directory: backend
        env:
          TMDB_READ_ACCESS_TOKEN: ''
      - name: TMDB auth and missing-poster API
        run: node --test --test-name-pattern="capas TMDB" test/integration.test.js
        working-directory: backend
        env:
          TMDB_READ_ACCESS_TOKEN: ''
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
